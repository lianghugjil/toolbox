<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox - 在线工具导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f1117;
            --card-bg: #1a1d27;
            --card-hover: #222636;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --text: #e4e6eb;
            --text-secondary: #8b8fa3;
            --border: #2d3040;
            --tag-free: #00b894;
            --tag-paid: #e17055;
            --tag-freemium: #fdcb6e;
            --tag-chinese: #0984e3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #2d1f4e 100%);
            padding: 48px 24px 36px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto 28px;
        }

        /* Search */
        .search-wrap {
            max-width: 520px;
            margin: 0 auto;
            position: relative;
        }
        .search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .search-input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color .2s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-secondary); }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            padding: 8px;
            display: none;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0,0,0,.4);
        }
        .search-suggestions.show { display: block; }
        .suggestion-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .9rem;
            color: var(--text-secondary);
            transition: all .15s;
        }
        .suggestion-item:hover { background: var(--accent); color: #fff; }
        .suggestion-item .sug-icon { font-size: 1.1rem; }
        .hot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 14px;
        }
        .hot-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .82rem;
            cursor: pointer;
            background: rgba(108,92,231,.12);
            color: var(--accent-light);
            border: 1px solid transparent;
            transition: all .2s;
        }
        .hot-tag:hover {
            background: rgba(108,92,231,.25);
            border-color: var(--accent);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 1.6rem; font-weight: 700; color: var(--accent-light); }
        .stat-label { font-size: .82rem; color: var(--text-secondary); margin-top: 2px; }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            gap: 24px;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 24px;
            align-self: flex-start;
        }
        .sidebar h3 {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-left: 12px;
        }
        .cat-list { list-style: none; }
        .cat-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .92rem;
            color: var(--text-secondary);
            transition: all .2s;
            margin-bottom: 2px;
        }
        .cat-item:hover { background: var(--card-bg); color: var(--text); }
        .cat-item.active {
            background: var(--accent);
            color: #fff;
        }
        .cat-item .cat-icon { font-size: 1.1rem; }
        .cat-item .cat-count {
            margin-left: auto;
            font-size: .75rem;
            background: rgba(255,255,255,.1);
            padding: 2px 8px;
            border-radius: 20px;
        }
        .cat-item.active .cat-count { background: rgba(255,255,255,.2); }

        .filter-section { margin-top: 28px; }
        .filter-section h3 { margin-bottom: 10px; }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 4px; }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: .82rem;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            transition: all .2s;
        }
        .filter-chip:hover { border-color: var(--accent); color: var(--text); }
        .filter-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Main Content */
        .main { flex: 1; min-width: 0; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .tool-count { font-size: .85rem; color: var(--text-secondary); }

        /* Tool Grid */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all .25s;
            position: relative;
            overflow: hidden;
        }
        .tool-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108,92,231,.15);
        }
        .tool-card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .tool-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .tool-info { flex: 1; min-width: 0; }
        .tool-name {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tool-subtitle {
            font-size: .8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .tool-desc {
            font-size: .88rem;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tool-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tool-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .3px;
        }
        .tag-free { background: rgba(0,184,148,.15); color: var(--tag-free); }
        .tag-paid { background: rgba(225,112,85,.15); color: var(--tag-paid); }
        .tag-freemium { background: rgba(253,203,110,.15); color: var(--tag-freemium); }
        .tag-chinese { background: rgba(9,132,227,.15); color: var(--tag-chinese); }
        .tag-hot { background: rgba(255,107,107,.15); color: #ff6b6b; }

        .tool-link {
            font-size: .78rem;
            color: var(--accent-light);
            text-decoration: none;
            opacity: 0;
            transition: opacity .2s;
        }
        .tool-card:hover .tool-link { opacity: 1; }

        /* No results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .no-results .emoji { font-size: 3rem; margin-bottom: 16px; }
        .no-results p { font-size: 1.05rem; }

        /* Mobile */
        .mobile-cats {
            display: none;
            overflow-x: auto;
            gap: 8px;
            padding: 0 24px 16px;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-cats::-webkit-scrollbar { display: none; }
        .mobile-cat {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: .85rem;
            white-space: nowrap;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: all .2s;
        }
        .mobile-cat.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        @media (max-width: 768px) {
            .header { padding: 32px 20px 24px; }
            .header h1 { font-size: 1.8rem; }
            .container { flex-direction: column; padding: 16px; }
            .sidebar { display: none; }
            .mobile-cats { display: flex; }
            .tool-grid { grid-template-columns: 1fr; }
            .stats { gap: 20px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tool-card { animation: fadeInUp .35s ease both; }
        .tool-card:nth-child(2) { animation-delay: .04s; }
        .tool-card:nth-child(3) { animation-delay: .08s; }
        .tool-card:nth-child(4) { animation-delay: .12s; }
        .tool-card:nth-child(5) { animation-delay: .16s; }
        .tool-card:nth-child(6) { animation-delay: .2s; }
    </style>
</head>
<body>

<div class="header">
    <h1>🧰 ToolBox</h1>
    <p>发现最好用的在线工具，按需分类，一目了然</p>
    <div class="search-wrap">

        <input class="search-input" id="searchInput" placeholder="搜索工具名称、功能、分类..." autocomplete="off" />

    <div class="stats">
        <div class="stat-item"><div class="stat-num" id="totalTools">0</div><div class="stat-label">收录工具</div></div>
        <div class="stat-item"><div class="stat-num" id="totalCats">0</div><div class="stat-label">工具分类</div></div>
        <div class="stat-item"><div class="stat-num" id="freeCount">0</div><div class="stat-label">免费工具</div></div>

</div>

<div class="mobile-cats" id="mobileCats"></div>

<div class="container">

</div>

// ============ 渲染 ============
function getCatCount(catId) {
    if (catId === "all") return TOOLS.length;
    return TOOLS.filter(t => t.cat === catId).length;
}

function renderSidebar() {

            <span>${c.name}</span>
            <span class="cat-count">${getCatCount(c.id)}</span>
        </li>`;
    });
    html += `</ul>`;
    html += `<div class="filter-section"><h3>💰 价格筛选</h3><div class="filter-chips">`;
    PRICE_FILTERS.forEach(p => {
        const active = currentPrice === p ? "active" : "";
        html += `<span class="filter-chip ${active}" data-price="${p}">${p}</span>`;
    });
    html += `</div></div>`;
    sidebar.innerHTML = html;

    // Mobile cats
    const mobileCats = document.getElementById("mobileCats");
    mobileCats.innerHTML = CATEGORIES.map(c =>
        `<span class="mobile-cat ${currentCat === c.id ? 'active' : ''}" data-cat="${c.id}">${c.icon} ${c.name}</span>`
    ).join("");
}

// ============ 搜索建议 & 热门搜索 ============
const HOT_SEARCHES = ["AI绘画", "视频剪辑", "免费工具", "写作", "抠图", "翻译", "ChatGPT", "音频"];

function renderHotTags() {
    const el = document.getElementById("hotTags");
    if (!el) return;
    el.innerHTML = HOT_SEARCHES.map(t => `<span class="hot-tag" data-search="${t}">${t}</span>`).join("");
}

function showSuggestions(query) {
    const sug = document.getElementById("suggestions");
    if (!sug) return;
    if (!query) { sug.classList.remove("show"); return; }

    const q = query.toLowerCase();
    const matchedCats = CATEGORIES.filter(c => c.id !== "all" && c.name.toLowerCase().includes(q));
    const matchedTools = TOOLS.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.desc.toLowerCase().includes(q) ||
        t.cat.toLowerCase().includes(q) ||
        t.tags.some(tag => tag.toLowerCase().includes(q))
    ).slice(0, 5);

    if (matchedCats.length === 0 && matchedTools.length === 0) {
        sug.classList.remove("show");
        return;
    }

    let html = "";
    matchedCats.forEach(c => {
        html += `<div class="suggestion-item" data-cat="${c.id}">
            <span class="sug-icon">${c.icon}</span>
            <span>查看分类：${c.name}</span>
        </div>`;
    });
    matchedTools.forEach(t => {
        html += `<div class="suggestion-item" data-url="${t.url}">
            <span class="sug-icon">${t.icon}</span>
            <span>${t.name} <small style="color:var(--text-secondary)">— ${t.cat}</small></span>
        </div>`;
    });

    sug.innerHTML = html;
    sug.classList.add("show");
}

function filterTools() {
    return TOOLS.filter(t => {
        if (currentCat !== "all" && t.cat !== currentCat) return false;
        if (currentPrice !== "全部" && t.price !== currentPrice) return false;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            // 搜索范围扩大：名称、描述、分类名、标签、价格、语言
            const haystack = [t.name, t.desc, t.cat, t.price, t.lang, ...t.tags].join(" ").toLowerCase();
            // 支持多关键词（空格分隔，每个都要匹配）
            const keywords = q.split(/\s+/).filter(Boolean);
            const match = keywords.every(kw => haystack.includes(kw));
            if (!match) return false;
        }
        return true;
    });
}

function renderTools() {
    const main = document.getElementById("mainContent");
    const tools = filterTools();

    if (tools.length === 0) {
        const catSuggest = CATEGORIES.filter(c => c.id !== "all").slice(0, 4);
        main.innerHTML = `<div class="no-results">
            <div class="emoji">🔍</div>
            <p>没有找到「${searchQuery || currentCat}」相关的工具</p>
            <p style="margin-top:12px;font-size:.9rem;">试试其他关键词，或者浏览这些分类：</p>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
                ${catSuggest.map(c => `<span class="hot-tag" data-cat-nav="${c.id}">${c.icon} ${c.name}</span>`).join("")}
            </div>
        </div>`;
        return;
    }

    const catName = currentCat === "all" ? "全部工具" : CATEGORIES.find(c => c.id === currentCat)?.name;
    let html = `<div class="section-header">
        <span class="section-title">${catName}</span>
        <span class="tool-count">${tools.length} 个工具</span>
    </div><div class="tool-grid">`;

    tools.forEach(t => {
        const priceClass = t.price === "免费" ? "tag-free" : t.price === "付费" ? "tag-paid" : "tag-freemium";
        const langClass = t.lang === "中文" ? "tag-chinese" : "";
        const hotTag = t.tags.includes("热门") ? `<span class="tag tag-hot">🔥 热门</span>` : "";

        html += `<a href="${t.url}" target="_blank" rel="noopener" class="tool-card" style="text-decoration:none;color:inherit;">
            <div class="tool-card-top">
                <div class="tool-icon" style="background:${t.color}22;color:${t.color}">${t.icon}</div>
                <div class="tool-info">
                    <div class="tool-name">${t.name}</div>
                    <div class="tool-subtitle">${t.cat}</div>
                </div>
            </div>
            <div class="tool-desc">${t.desc}</div>
            <div class="tool-footer">
                <div class="tool-tags">
                    <span class="tag ${priceClass}">${t.price}</span>
                    ${langClass ? `<span class="tag ${langClass}">${t.lang}</span>` : ""}
                    ${hotTag}
                </div>
                <span class="tool-link">访问 →</span>
            </div>
        </a>`;
    });

    html += `</div>`;
    main.innerHTML = html;
}

function renderStats() {
    document.getElementById("totalTools").textContent = TOOLS.length;
    document.getElementById("totalCats").textContent = CATEGORIES.length - 1;
    document.getElementById("freeCount").textContent = TOOLS.filter(t => t.price === "免费").length;
}

function render() {
    renderSidebar();
    renderTools();
    renderStats();
    renderHotTags();
}

// ============ 事件 ============
document.getElementById("sidebar")?.addEventListener("click", e => {
    const item = e.target.closest("[data-cat]");
    if (!item) return;
    currentCat = item.dataset.cat;
    render();
});

document.getElementById("mobileCats")?.addEventListener("click", e => {
    const item = e.target.closest("[data-cat]");
    if (!item) return;
    currentCat = item.dataset.cat;
    render();
});

document.getElementById("sidebar")?.addEventListener("click", e => {
    const chip = e.target.closest("[data-price]");
    if (!chip) return;
    currentPrice = chip.dataset.price;
    render();
});

// 搜索输入
document.getElementById("searchInput").addEventListener("input", e => {
    searchQuery = e.target.value.trim();
    showSuggestions(searchQuery);
    renderTools();
});

// 搜索框失焦隐藏建议
document.getElementById("searchInput").addEventListener("blur", () => {
    setTimeout(() => document.getElementById("suggestions")?.classList.remove("show"), 200);
});

// 点击搜索建议
document.getElementById("suggestions")?.addEventListener("click", e => {
    const item = e.target.closest("[data-cat]");
    const urlItem = e.target.closest("[data-url]");
    if (item) {
        currentCat = item.dataset.cat;
        searchQuery = "";
        document.getElementById("searchInput").value = "";
        render();
    } else if (urlItem) {
        window.open(urlItem.dataset.url, "_blank");
    }
});

// 热门搜索标签
document.getElementById("hotTags")?.addEventListener("click", e => {
    const tag = e.target.closest("[data-search]");
    if (!tag) return;
    searchQuery = tag.dataset.search;
    document.getElementById("searchInput").value = searchQuery;
    renderTools();
});

// 无结果页的分类导航
document.getElementById("mainContent")?.addEventListener("click", e => {
    const nav = e.target.closest("[data-cat-nav]");
    if (!nav) return;
    currentCat = nav.dataset.catNav;
    searchQuery = "";
    document.getElementById("searchInput").value = "";
    render();
});

// ============ 初始化 ============
render();
</script>
</body>
</html>
